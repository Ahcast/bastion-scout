name: Scout checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install existing Scout dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Verify pipeline with synthetic sources, AI and manual clock
        run: python3 -m unittest discover -s tests -v
